[project]
name = "rent-api"
version = "0.0.1"
description = "Rent App API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.0.57",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  "geoalchemy2==0.21.0",
  "pydantic[email]==2.14.3",
  "email-validator==2.3.0",  # EmailStr (via pydantic[email]), pinned explicitly
  "pydantic-settings==2.16.2",
  "redis==5.3.1",          # arq 0.28 requires redis<6
  "arq==0.28.0",
  "httpx==0.28.1",         # the Nominatim client (spec 0003c)
  "pillow==13.0.0",       # photo decode, orient, resize, WebP re-encode (spec 0010d)
  "boto3==1.44.2",        # the R2 photo store over the S3 API (spec 0010d)
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "types-redis==4.6.0.20241004",
  "boto3-stubs[s3]==1.44.2",  # mypy types for the R2 store
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
# The `alembic/` migrations directory would otherwise make the alembic package look first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
