[project]
name = "rent-api"
version = "0.0.1"
description = "Rent App API (FastAPI)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.162.2",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.0.57",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.8",
  "geoalchemy2==0.21.0",
  "pydantic[email]==2.14.3",
  "email-validator==2.3.0",  # EmailStr (via pydantic[email]), pinned explicitly
  "pydantic-settings==2.16.2",
  "redis==5.3.1",          # arq 0.28 requires redis<6
  "arq==0.28.0",
  "httpx==0.28.1",         # the Nominatim client (spec 0003c)
  "pillow==13.0.0",       # photo decode, orient, resize, WebP re-encode (spec 0010d)
  "boto3==1.44.2",        # the R2 photo store over the S3 API (spec 0010d)
  "openpyxl==3.1.5",      # the CBS rent table xlsx (spec 0014d)
  "argon2-cffi==25.1.0",  # argon2id password hashes, a random salt each (spec 0016a)
  "google-auth==2.62.2",  # Google ID-token checks, jwt.decode (spec 0016b); keys fetched with httpx
  "tzdata==2026.6",       # the IANA zones for zoneinfo (spec 0018a: Asia/Jerusalem); the slim image has none
  "sentry-sdk[fastapi]==2.75.0",  # errors to Sentry (spec 0019a); the arq integration ships inside it
]

[dependency-groups]
dev = [
  "pytest==9.2.0",
  "pytest-asyncio==1.4.1.post1",
  "ruff==0.17.4",
  "mypy==2.4.1",
  "types-redis==4.6.0.20241004",
  "boto3-stubs[s3]==1.44.2",  # mypy types for the R2 store
  "types-openpyxl==3.1.5.20261017",  # mypy types for the CBS xlsx parser
  "cryptography==50.0.2",  # test RSA keys for Google ID tokens (spec 0016b)
]
# The admin dashboard (spec 0012b): installed in the admin image, never in the public one.
admin = [
  "sqladmin[auth]==0.32.0",
]

[tool.uv]
package = false
# `make test` / `make lint` / CI's `uv sync --frozen` get both; Dockerfile.api passes
# --no-default-groups, so the public image has neither.
default-groups = ["dev", "admin"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.isort]
# The `alembic/` migrations directory would otherwise make the alembic package look first-party.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
