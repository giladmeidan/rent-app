name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the GITHUB_TOKEN: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every run on main finishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rent
          POSTGRES_PASSWORD: rent
          POSTGRES_DB: rent
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U rent -d rent"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://rent:rent@localhost:5432/rent
      TEST_DATABASE_URL: postgresql+psycopg://rent:rent@localhost:5432/rent_test
      REDIS_URL: redis://localhost:6379/0
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.16"
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: Install Python and dependencies
        run: uv --directory api sync --frozen
      - name: Lint (ruff + mypy --strict)
        run: make lint
      - name: Test (pytest against the postgis + redis service containers)
        run: make test
