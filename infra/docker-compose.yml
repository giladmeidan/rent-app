name: rent-app

# Every published port binds to loopback only: the dev DB user is a superuser and Redis has no auth,
# so nothing here may be reachable from the LAN.

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rent
      POSTGRES_PASSWORD: rent
      POSTGRES_DB: rent
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Over TCP, not the Unix socket: on a fresh volume the image's init runs a temporary server
      # that listens on the socket only, then restarts, so a socket check reports healthy too early.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rent -d rent"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --timeout-graceful-shutdown 5
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://rent:rent@db:5432/rent
      REDIS_URL: redis://redis:6379/0
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:${WEB_PORT:-5173}}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-0123456789abcdef}
      # Keys the re-signup block's email hash (spec 0013c); never rotated in production.
      EMAIL_BLOCK_KEY: ${EMAIL_BLOCK_KEY:-dev-only-email-block-key-0123456789abcdef}
      EMAIL_BACKEND: file
      EMAIL_OUTBOX_DIR: /outbox
      # Photos (spec 0010d): the file store, served by the api itself at /media.
      PHOTO_BACKEND: file
      PHOTO_DIR: /media
      PHOTO_PUBLIC_BASE_URL: http://localhost:${API_PORT:-8000}/media
      # Google sign-in (spec 0016b): `fake` credentials unless `.env` says otherwise.
      GOOGLE_VERIFIER: ${GOOGLE_VERIFIER:-fake}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # As in the image: two glibc malloc arenas, so photo decodes do not pin memory per thread.
      MALLOC_ARENA_MAX: "2"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ../api:/app
      # Dev email outbox: the login code is in the newest file (`make dev` creates it 0777 first).
      - ../.outbox:/outbox
      # Dev photo store: the uploaded WebP files (`make dev` creates it 0777 first; `make down` empties it).
      - ../.media:/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    command: arq app.worker.WorkerSettings
    # arq exits when Redis goes away; come back once it is reachable again.
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://rent:rent@db:5432/rent
      REDIS_URL: redis://redis:6379/0
      # worker.py loads Settings at import, which requires SECRET_KEY.
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-0123456789abcdef}
      # Keys the re-signup block's email hash (spec 0013c); never rotated in production.
      EMAIL_BLOCK_KEY: ${EMAIL_BLOCK_KEY:-dev-only-email-block-key-0123456789abcdef}
      # Geocoding (spec 0003c): `fake` (no network) unless a deployment sets it; CI's e2e has no .env.
      GEOCODER: ${GEOCODER:-fake}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_USER_AGENT: ${NOMINATIM_USER_AGENT:-rent-app-dev/0.0.1}
      # Official rent figures (spec 0014a): `off` (no request) unless a deployment sets `nadlan`.
      RENT_REFERENCE: ${RENT_REFERENCE:-off}
      NADLAN_RENT_URL: ${NADLAN_RENT_URL:-https://data.nadlan.gov.il/api/pages}
    volumes:
      - ../api:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The admin dashboard (spec 0012b): `make admin` only (a profile, so `make dev` never starts it).
  # Connects as the `homie_admin` role (scripts/admin_role.py); NF4 refuses the empty defaults.
  admin:
    profiles: ["admin"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.admin
    command: uvicorn admin.main:main --factory --host 0.0.0.0 --port 8001 --reload
    # No restart: without real secrets it exits at once (NF4) instead of crash-looping.
    restart: "no"
    environment:
      ADMIN_DATABASE_URL: postgresql+psycopg://homie_admin:${ADMIN_DB_PASSWORD:-dev-only-admin-db-password}@db:5432/rent
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SECRET_KEY: ${ADMIN_SECRET_KEY:-}
    ports:
      - "127.0.0.1:${ADMIN_PORT:-8001}:8001"
    volumes:
      - ../api:/app
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    environment:
      # The browser calls the API directly on its host port (no Vite proxy). Must stay `localhost`:
      # the page origin is http://localhost:${WEB_PORT}  (default 5173), the only origin the API's CORS allows.
      VITE_API_URL: http://localhost:${API_PORT:-8000}
      # The MapLibre style (spec 0003d): public OSM raster tiles until self-hosted Protomaps.
      VITE_MAP_STYLE_URL: ${VITE_MAP_STYLE_URL:-/map/osm-raster.json}
      VITE_CONTACT_EMAIL: ${VITE_CONTACT_EMAIL:-}
      # Empty: no Google button (spec 0016b).
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-5173}:5173"
    volumes:
      - ../web:/app
      # Keep the image's Linux node_modules; the host's (if any) is for another platform.
      - /app/node_modules

volumes:
  pgdata:
